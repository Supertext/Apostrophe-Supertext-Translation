name: Links

# Checks the links in all Markdown files: weekly, and when docs change on main.
# Broken links open (or update) the issue "Broken links in the docs".
# See docs/DEVELOPER.md → Code quality and security checks.
on:
  push:
    branches: [main]
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/links.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200..=299,403,429
            --exclude-path node_modules --exclude-path vendor
            './**/*.md'
          output: lychee/out.md
          fail: false
      - name: Report broken links
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Broken links in the docs"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file lychee/out.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file lychee/out.md
          fi
          # A docs push that breaks links also turns its commit red.
          if [ "$EVENT" = push ]; then exit 1; fi
